[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asistente-faena"
version = "0.1.0"
description = "Asistente de faena con LLM, RAG y agentes (prototipo académico, caso Codelco Chuquicamata)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
